<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sankyu — Esteiras de Produção</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif',Georgia,serif;background:#0e0e0f;color:#e8e4d8;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
input,select,textarea{background:#1a1a1d;border:1px solid #2a2a2e;border-radius:8px;padding:8px 10px;font-size:13px;color:#e8e4d8;width:100%;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#5c4db1}
select option{background:#1a1a1d}
button{font-family:inherit;cursor:pointer}
label{cursor:pointer}

#app{max-width:960px;margin:0 auto;padding:0 16px 60px}

/* header */
.hdr{border-bottom:1px solid #1e1e20;padding:12px 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0e0e0f;z-index:50}
.hdr-left{display:flex;align-items:center;gap:14px}
.logo{height:36px;width:auto}
.hdr-text .sub{font-size:10px;letter-spacing:.2em;color:#5c4db1;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:2px}
.hdr-text .title{font-size:16px;font-weight:600;color:#e8e4d8}
.hdr-right{display:flex;align-items:center;gap:8px}
.saving{font-size:10px;color:#555;font-family:'DM Mono',monospace}
.btn-primary{background:#1a1628;border:1px solid #5c4db1;border-radius:8px;padding:7px 14px;color:#9b7cf6;font-size:12px;font-weight:500;font-family:'DM Mono',monospace}
.btn-primary:hover{background:#221a38}

/* alerts */
.alerts{display:none;padding:8px 0;border-bottom:1px solid #1e1e20;gap:8px;flex-wrap:wrap}
.alerts.show{display:flex}
.alert-item{background:#1a1206;border:1px solid #3a2508;border-radius:6px;padding:4px 12px;font-size:11px;color:#c9883a;font-family:'DM Mono',monospace;display:flex;align-items:center;gap:6px}
.adot{width:5px;height:5px;border-radius:50%;background:#c9883a;display:inline-block}

/* tabs */
.tabs{display:flex;border-bottom:1px solid #1e1e20}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#555;padding:10px 14px;font-size:12px;font-family:'DM Mono',monospace;letter-spacing:.06em}
.tab.active{border-bottom-color:#8b7cf6;color:#e8e4d8}
.tab:hover:not(.active){color:#999}
.pane{padding:18px 0;display:none}
.pane.active{display:block}

/* esteiras */
.egrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ecard{background:#111113;border:1px solid #1e1e22;border-radius:12px;padding:14px;display:flex;flex-direction:column;min-height:360px;min-width:0;overflow:hidden}
.ecard-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ecard-icon{font-size:10px;color:#444;font-family:'DM Mono',monospace;margin-bottom:2px}
.ecard-name{font-size:14px;font-weight:600;color:#e8e4d8}
.ecard-cnt{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;text-align:right}
.ecard-meta{font-size:10px;color:#444;font-family:'DM Mono',monospace}
.pbar{height:3px;background:#1e1e22;border-radius:2px;margin-bottom:12px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s}
.vlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.empty-msg{text-align:center;padding:20px 8px;color:#383838;font-size:12px;font-style:italic}
.vitem{background:#17171a;border:1px solid #222;border-radius:8px;padding:7px 9px;display:flex;align-items:flex-start;gap:7px;cursor:pointer;min-width:0;overflow:hidden}
.vitem:hover{border-color:#333}
.chk{width:17px;height:17px;border-radius:50%;border:1px solid #383838;background:transparent;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#4caf76}
.chk.done{border-color:#4caf76;background:#1a3325}
.chk:disabled{opacity:.3;cursor:default}
.vtitle{font-size:12px;font-weight:600;color:#e0ddd5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;margin-bottom:3px;line-height:1.4}
.tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 5px;border-radius:8px}
.tag-tipo{background:#1e1e22;color:#777;border:1px solid #262628}
.tag-prof{background:#1a1526;color:#7b6cd6;border:1px solid #2a2040}
.btn-add-e{margin-top:10px;background:none;border:1px dashed #252528;border-radius:8px;padding:6px;color:#444;font-size:11px;font-family:'DM Mono',monospace;width:100%}
.btn-add-e:hover{border-color:#444;color:#888}
.stage-locked{text-align:center;padding:8px;font-size:10px;color:#383838;font-style:italic;font-family:'DM Mono',monospace}

/* dashboard */
.dash-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.dash-filters select{width:auto;font-size:12px;padding:6px 10px}
.dash-filters label{font-size:11px;color:#666;font-family:'DM Mono',monospace;white-space:nowrap}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:#111113;border:1px solid #1e1e22;border-radius:10px;padding:14px 16px;text-align:center}
.kpi-num{font-size:26px;font-weight:600;font-family:'DM Mono',monospace}
.kpi-lbl{font-size:10px;color:#555;font-family:'DM Mono',monospace;margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.chart-card{background:#111113;border:1px solid #1e1e22;border-radius:12px;padding:16px}
.chart-title{font-size:12px;font-weight:600;color:#888;font-family:'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.chart-wrap{position:relative;height:200px}
.chart-full{grid-column:1/-1}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-bottom:20px}
.prof-card{background:#111113;border:1px solid #1e1e22;border-radius:10px;padding:12px 14px}
.prof-instr{font-size:10px;color:#444;font-family:'DM Mono',monospace;margin-bottom:3px}
.prof-nome{font-size:14px;font-weight:600;color:#e8e4d8;margin-bottom:8px}
.pbar-row{display:flex;align-items:center;gap:8px}
.pbar-num{font-size:12px;font-weight:600;font-family:'DM Mono',monospace}

/* hist */
.hist-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hist-mes{font-size:12px;font-weight:600;color:#8b7cf6;font-family:'DM Mono',monospace}
.hist-cnt{font-size:11px;color:#444;font-family:'DM Mono',monospace}
.hdiv{flex:1;height:1px;background:#1e1e22}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:22px}
.hcard{background:#111113;border:1px solid #1e1e22;border-radius:8px;padding:10px 12px}
.htitle{font-size:12px;font-weight:600;color:#e8e4d8;margin-bottom:6px}
.tag-done{font-size:9px;padding:2px 5px;border-radius:8px;background:#1a3325;color:#4caf76}

/* professores admin */
.padmin-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #1a1a1d}
.padmin-row:last-child{border-bottom:none}
.padmin-nome{font-size:13px;font-weight:600;color:#e8e4d8;flex:1}
.padmin-instr{font-size:11px;color:#777;flex:1}
.btn-edit{background:none;border:1px solid #2a2a2e;border-radius:6px;padding:4px 10px;color:#888;font-size:11px}
.btn-edit:hover{border-color:#555;color:#ccc}
.btn-del{background:none;border:1px solid #3a1515;border-radius:6px;padding:4px 10px;color:#c05050;font-size:11px}
.btn-del:hover{background:#1a0808}

/* modais */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#111113;border:1px solid #2a2a2e;border-radius:14px;padding:22px;width:420px;max-height:90vh;overflow-y:auto}
.modal.wide{width:520px}
.modal h3{font-size:15px;font-weight:600;color:#e8e4d8;margin-bottom:18px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:10px;color:#555;font-family:'DM Mono',monospace;margin-bottom:5px;letter-spacing:.1em;text-transform:uppercase}
textarea{resize:vertical}
.cb-group{display:flex;flex-direction:column;gap:8px}
.cb-lbl{display:flex;align-items:center;gap:10px;font-size:13px;color:#ccc}
.cb-lbl input[type=checkbox]{width:14px;height:14px;accent-color:#8b7cf6}
.mactions{display:flex;gap:8px;margin-top:18px}
.btn-cancel{flex:1;padding:9px;background:none;border:1px solid #2a2a2e;border-radius:8px;color:#666;font-size:13px}
.btn-cancel:hover{border-color:#444;color:#aaa}
.btn-ok{flex:2;padding:9px;background:#17122a;border:1px solid #5c4db1;border-radius:8px;color:#9b7cf6;font-size:13px;font-weight:600}
.btn-ok:hover{background:#1f1838}
.badge-done{font-size:9px;padding:3px 8px;background:#1a3325;color:#4caf76;border-radius:10px;border:1px solid #2a4e38;white-space:nowrap}
.detail-tag{font-size:11px;padding:3px 10px;border-radius:10px;background:#1e1e22;color:#777;border:1px solid #252528}
.prog-sec{border-top:1px solid #1e1e22;padding-top:12px;margin:12px 0}
.prog-lbl{font-size:10px;color:#444;font-family:'DM Mono',monospace;margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase}
.est-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #17171a}
.est-row-name{font-size:13px;color:#ccc}
.tog{font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer}
.tog.done{border:1px solid #4caf76;background:#1a3325;color:#4caf76}
.tog.pending{border:1px solid #2a2a2e;background:transparent;color:#555}
.tog.active-stage{border:1px solid #8b7cf6;background:#1a1628;color:#9b7cf6;font-weight:500}
.tog.active-stage:hover{background:#221a38}
.tog:hover{opacity:.8}
.tog:disabled{opacity:.3;cursor:default}
.detail-obs{font-size:12px;color:#555;font-style:italic;margin-bottom:12px}
.btn-del2{padding:9px 14px;background:none;border:1px solid #3a1515;border-radius:8px;color:#c05050;font-size:12px}
.btn-del2:hover{background:#1a0808}
.section-divider{font-size:10px;color:#444;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;padding:10px 0 6px;border-top:1px solid #1e1e22;margin-top:8px}
.plat-grid{display:flex;gap:6px;flex-wrap:wrap}
.plat-cb{display:flex;align-items:center;gap:6px;font-size:12px;color:#ccc;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:8px;padding:5px 10px;cursor:pointer}
.plat-cb input{width:12px;height:12px;accent-color:#8b7cf6}
.fin-wrap{background:#111113;border:1px solid #1e1e22;border-radius:12px;overflow:hidden}
.fin-table{width:100%;border-collapse:collapse;font-size:12px}
.fin-table th{text-align:left;padding:8px 12px;font-size:10px;color:#555;font-family:'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #1e1e22;font-weight:400}
.fin-table td{padding:9px 12px;border-bottom:1px solid #17171a;color:#ccc;vertical-align:middle}
.fin-table tr:hover td{background:#131315;cursor:pointer}
.fin-table tr:last-child td{border-bottom:none}
.fin-plat{display:flex;gap:4px;flex-wrap:wrap}
.fin-plat span{font-size:9px;padding:2px 6px;border-radius:8px;background:#1a3325;color:#4caf76;border:1px solid #2a4e38}
.ro-field{background:#141416;border:1px solid #1e1e22;border-radius:8px;padding:10px 12px;font-size:12px;color:#888;line-height:1.6;white-space:pre-wrap;word-break:break-all;min-height:36px}
.ro-field.lg{min-height:120px}
</style>
</head>

<script>
const META=3;
const EL={roteiro:'Roteiro',gravacao:'Gravação',edicao:'Edição',publicacao:'Publicação'};
const EE={roteiro:'✦',gravacao:'◉',edicao:'◈',publicacao:'◆'};
const ESTEIRAS=['roteiro','gravacao','edicao','publicacao'];
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_F=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const PLATAFORMAS=['Instagram','YouTube','TikTok','Facebook','WhatsApp'];
const COLOR={roteiro:'#8b7cf6',gravacao:'#5bafd6',edicao:'#e09050',publicacao:'#4caf76'};
const NEXT_LABEL={roteiro:'Enviar p/ Gravação',gravacao:'Enviar p/ Edição',edicao:'Enviar p/ Publicação',publicacao:'Finalizar'};
let tipos=[];

let videos=[], professores=[], curTab='esteiras', editProfId=null, editVidId=null, editTipoId=null;
let charts={};

async function api(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts); return r.json();
}
function saving(s){document.getElementById('saving').style.display=s?'inline':'none'}

async function load(){
  [videos,professores,tipos]=await Promise.all([api('/api/videos'),api('/api/professores'),api('/api/tipos')]);
  // tipos from API are objects {id, nome} — keep as objects
  renderAll();
}

function renderAll(){
  renderAlerts();
  if(curTab==='esteiras') renderEsteiras();
  else if(curTab==='finalizados') renderFinalizados();
  else if(curTab==='dashboard') renderDash();
  else if(curTab==='professores') renderProfessores();
  else if(curTab==='tipos') renderTipos();
}

function renderAlerts(){
  const al=document.getElementById('alerts');
  const bad=ESTEIRAS.filter(e=>getDone(e).length<META);
  if(!bad.length){al.className='alerts';return;}
  al.className='alerts show';
  al.innerHTML=bad.map(e=>`<div class="alert-item"><span class="adot"></span>${EL[e]}: ${getDone(e).length}/${META} finalizados</div>`).join('');
}

function getDone(e){
  const k='status'+cap(e);
  return videos.filter(v=>v.esteiras[e]&&v[k]==='done');
}
function getActive(e){
  const k='status'+cap(e);
  return videos.filter(v=>v.esteiras[e]&&v[k]!=='done');
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function getMesAno(d){if(!d)return'';const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function color(c){return c>=META?'#4caf76':c>=1?'#c9883a':'#e05c5c'}
function isConcluido(v){
  const st=v.activeStages||[];
  return st.length>0&&st.every(e=>v['status'+cap(e)]==='done');
}

// ── Esteiras ─────────────────────────────────────────────────────────────────

function renderEsteiras(){
  const el=document.getElementById('pane-esteiras');
  el.innerHTML=`<div class="egrid">${ESTEIRAS.map(renderECard).join('')}</div>`;
}

function renderECard(esteira){
  const done=getDone(esteira);
  const active=getActive(esteira);
  const pct=Math.min(100,Math.round((done.length/META)*100));
  const c=color(done.length);

  const items=active.length===0
    ?`<div class="empty-msg">Nenhum em andamento</div>`
    :active.map(v=>{
      const isCurrentStage=v.currentStage===esteira;
      const locked=!isCurrentStage;
      const profLabel=v.professor?`${v.professor.nome} (${v.professor.instrumento})`:'';
      const tags=[
        v.tipo?`<span class="tag tag-tipo">${v.tipo}</span>`:'',
        profLabel?`<span class="tag tag-prof">${profLabel}</span>`:''
      ].join('');
      if(locked){
        return `<div class="vitem" style="opacity:.35;cursor:default">
          <div style="flex:1;min-width:0">
            <div class="vtitle">${v.titulo}</div>
            <div class="stage-locked">aguardando etapa anterior</div>
          </div></div>`;
      }
      const completedStyle=isConcluido(v)?'border-color:#4caf7666;':'';
      return `<div class="vitem" style="${completedStyle}" onclick="openDetail('${v.id}')">
        <div style="flex:1;min-width:0">
          <div class="vtitle">${v.titulo}</div>
          <div class="tags">${tags}</div>
        </div></div>`;
    }).join('');

  return `<div class="ecard">
    <div class="ecard-hdr">
      <div><div class="ecard-icon">${EE[esteira]}</div><div class="ecard-name">${EL[esteira]}</div></div>
      <div><div class="ecard-cnt" style="color:${c}">${done.length}</div><div class="ecard-meta">/${META} meta</div></div>
    </div>
    <div class="pbar"><div class="pfill" style="width:${pct}%;background:${c}"></div></div>
    <div class="vlist" style="max-height:420px;overflow-y:auto">${items}</div>
  </div>`;
}

// ── Toggle ────────────────────────────────────────────────────────────────────

// ── Validation helpers ────────────────────────────────────────────────────────

function showFieldError(fieldId, msg){
  const el=document.getElementById(fieldId);
  if(!el) return;
  el.style.borderColor='#e05c5c';
  el.style.boxShadow='0 0 0 2px #e05c5c44';
  let hint=el.parentElement.querySelector('.field-err');
  if(!hint){
    hint=document.createElement('div');
    hint.className='field-err';
    hint.style.cssText='font-size:11px;color:#e05c5c;margin-top:4px;font-family:\'DM Mono\',monospace;';
    el.parentElement.appendChild(hint);
  }
  hint.textContent=msg;
  el.addEventListener('input',()=>{
    el.style.borderColor='';el.style.boxShadow='';
    if(hint) hint.remove();
  },{once:true});
}

function validateAndGetFields(esteira){
  // Read current values from DOM fields (they may have been edited before clicking finalizar)
  const errors=[];
  const body={};

  if(esteira==='roteiro'){
    const rt=document.getElementById('det-roteiro');
    const val=(rt?.value||'').trim();
    body.roteiro_texto=rt?.value||'';
    if(!val){ showFieldError('det-roteiro','Preencha o roteiro antes de finalizar.'); errors.push('roteiro'); }
  }
  if(esteira==='gravacao'){
    const gd=document.getElementById('det-gdata');
    const gh=document.getElementById('det-ghor');
    const gl=document.getElementById('det-glocal');
    body.gravacao_data=gd?.value||'';
    body.gravacao_horario=gh?.value||'';
    body.gravacao_local=gl?.value||'';
    if(!gd?.value){ showFieldError('det-gdata','Informe a data.'); errors.push('gdata'); }
    if(!gh?.value){ showFieldError('det-ghor','Informe o horário.'); errors.push('ghor'); }
    if(!(gl?.value||'').trim()){ showFieldError('det-glocal','Informe o local.'); errors.push('glocal'); }
  }
  if(esteira==='edicao'){
    const ec=document.getElementById('det-caminho');
    body.edicao_caminho=ec?.value||'';
    if(!(ec?.value||'').trim()){ showFieldError('det-caminho','Informe o caminho do arquivo.'); errors.push('caminho'); }
  }
  if(esteira==='publicacao'){
    const pd=document.getElementById('det-pubdata');
    body.pub_data=pd?.value||'';
    const boxes=document.querySelectorAll('[id^="plat-grid-"] input[type=checkbox]');
    const plat=[...boxes].filter(b=>b.checked).map(b=>b.value);
    body.pub_plataformas=plat;
    if(!pd?.value){ showFieldError('det-pubdata','Informe a data de publicação.'); errors.push('pubdata'); }
    if(plat.length===0){
      const grid=document.querySelector('[id^="plat-grid-"]');
      if(grid){
        grid.style.outline='2px solid #e05c5c44';grid.style.borderRadius='8px';
        let hint=grid.parentElement.querySelector('.field-err');
        if(!hint){hint=document.createElement('div');hint.className='field-err';hint.style.cssText='font-size:11px;color:#e05c5c;margin-top:4px;font-family:\'DM Mono\',monospace;';grid.parentElement.appendChild(hint);}
        hint.textContent='Selecione ao menos uma plataforma.';
      }
      errors.push('plataformas');
    }
  }
  return {errors, body};
}

async function tog(vid, esteira){
  const v=videos.find(x=>x.id===vid);
  if(!v) return;
  const k='status'+cap(esteira);
  const alreadyDone=v[k]==='done';

  // If UN-marking done → no validation needed, just toggle back
  if(alreadyDone){
    saving(true);
    const upd=await api(`/api/videos/${vid}/toggle`,'POST',{esteira});
    const i=videos.findIndex(x=>x.id===vid); if(i!==-1) videos[i]=upd;
    renderAll();
    const md=document.getElementById('m-detail');
    if(md.style.display!=='none') renderDetailBody(upd);
    saving(false);
    return;
  }

  // Validate required fields for this stage
  const {errors, body}=validateAndGetFields(esteira);
  if(errors.length>0) return; // stop — fields are highlighted

  // Save the field values first, then toggle
  saving(true);
  if(Object.keys(body).length>0) await api(`/api/videos/${vid}`,'PUT',body);
  const upd=await api(`/api/videos/${vid}/toggle`,'POST',{esteira});
  const i=videos.findIndex(x=>x.id===vid); if(i!==-1) videos[i]=upd;

  // If publicação just got finalized → close modal, go to Finalizados tab
  if(esteira==='publicacao' && upd.statusPublicacao==='done' && isConcluido(upd)){
    closeDetail();
    const finBtn=document.querySelector('.tab[onclick*="finalizados"]');
    if(finBtn) sw('finalizados', finBtn);
    saving(false);
    return;
  }

  renderAll();
  const md=document.getElementById('m-detail');
  if(md.style.display!=='none') renderDetailBody(upd);
  saving(false);
}

// ── Confirm advance to next stage ─────────────────────────────────────────────

async function confirmAdvance(vid, esteira){
  // First save any edited fields
  await saveDetailFields(vid);
  // Validate
  const {errors}=validateAndGetFields(esteira);
  if(errors.length>0) return;
  // Confirmation dialog
  const nextLabel=NEXT_LABEL[esteira]||'avançar';
  const confirmed=confirm(`Confirmar: "${nextLabel}"?\n\nIsso finalizará a etapa de ${EL[esteira]} e avançará para a próxima.`);
  if(!confirmed) return;
  await tog(vid, esteira);
}

function renderDetailBody(v){

  const currentIdx=stages.indexOf(v.currentStage);
  const showUpTo=concluido ? stages.length-1 : (currentIdx===-1 ? stages.length-1 : currentIdx);
  const visibleStages=stages.slice(0, showUpTo+1);

  let extraFields='';
  visibleStages.forEach(e=>{
    if(e==='roteiro'){
      extraFields+=`<div class="section-divider">✦ Roteiro do vídeo</div>
        <div class="fg"><label class="fl">Script / falas / contexto <span style="color:#e05c5c">*</span></label>

          style="min-height:160px">${v.roteiroTexto||''}</textarea></div>`;
    }
    if(e==='gravacao'){
      extraFields+=`<div class="section-divider">◉ Dados da gravação</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div class="fg"><label class="fl">Data <span style="color:#e05c5c">*</span></label><input id="det-gdata" type="date" value="${v.gravacaoData||''}"/></div>
          <div class="fg"><label class="fl">Horário <span style="color:#e05c5c">*</span></label><input id="det-ghor" type="time" value="${v.gravacaoHorario||''}"/></div>
        </div>
        <div class="fg"><label class="fl">Local <span style="color:#e05c5c">*</span></label><input id="det-glocal" placeholder="Ex: Estúdio A, Escola Sankyu" value="${(v.gravacaoLocal||'').replace(/"/g,'&quot;')}"/></div>`;
    }
    if(e==='edicao'){
      extraFields+=`<div class="section-divider">◈ Arquivo editado</div>
        <div class="fg"><label class="fl">Caminho no Google Drive <span style="color:#e05c5c">*</span></label>
        <input id="det-caminho" placeholder="Ex: 2.2 Material Bruto - 2026\\2026 - Conteúdo\\05 MAI 26\\[Chamada] Evento - 05.05.2026.mp4"
          value="${(v.edicaoCaminho||'').replace(/"/g,'&quot;')}"/></div>`;
    }
    if(e==='publicacao'){
      const plat=v.pubPlataformas||[];
      const platCbs=PLATAFORMAS.map(p=>
        `<label class="plat-cb"><input type="checkbox" ${plat.includes(p)?'checked':''} value="${p}"> ${p}</label>`
      ).join('');
      extraFields+=`<div class="section-divider">◆ Publicação</div>
        <div class="fg"><label class="fl">Data de publicação <span style="color:#e05c5c">*</span></label><input id="det-pubdata" type="date" value="${v.pubData||''}"/></div>
        <div class="fg"><label class="fl">Plataformas <span style="color:#e05c5c">*</span></label><div class="plat-grid" id="plat-grid-${v.id}">${platCbs}</div></div>`;
    }
  });

  const rows=stages.map(e=>{
    const k='status'+cap(e);
    const isDone=v[k]==='done';
    const isCurrent=v.currentStage===e;
    const canInteract=isDone||isCurrent;
    const disabled=!canInteract?'disabled':'';
    let btnLabel, btnClass;
    if(isDone){ btnLabel='✓ feito'; btnClass='done'; }
    else if(isCurrent){ btnLabel='em andamento'; btnClass='pending active-stage'; }
    else { btnLabel='pendente'; btnClass='pending'; }
    // Only done stages can be un-toggled; current shows status; locked is disabled
    const clickable=isDone?`onclick="tog('${v.id}','${e}')"`:'';
    return `<div class="est-row">
      <span class="est-row-name">${EE[e]} ${EL[e]}</span>
      <button class="tog ${btnClass}" ${!canInteract?'disabled':''} ${clickable}>${btnLabel}</button>
    </div>`;
  }).join('');

  // Card border: green when fully concluido
  const cardBorder=concluido?'border:1px solid #4caf76;box-shadow:0 0 0 1px #4caf7644;':'';

  document.getElementById('m-detail-body').setAttribute('style', cardBorder ? cardBorder+';background:#111113;border-radius:14px;padding:22px;width:520px;max-height:90vh;overflow-y:auto' : '');

  document.getElementById('m-detail-body').innerHTML=`

      <h3 style="margin-bottom:0;flex:1;margin-right:10px">${v.titulo}</h3>
      ${concluido?'<span class="badge-done">✓ Concluído</span>':''}

    ${v.tipo?`<div style="margin-bottom:8px"><span class="detail-tag">${v.tipo}</span></div>`:''}
    ${v.professor?`<div style="font-size:12px;color:#7b6cd6;margin-bottom:10px">${v.professor.nome} — ${v.professor.instrumento}</div>`:''}
    <div class="prog-sec">

      ${rows}
    </div>
    ${extraFields}
    ${v.obs?`<div class="detail-obs" style="margin-top:8px">${v.obs}</div>`:''}
    <div class="mactions">
      <button class="btn-cancel" onclick="saveDetailFields('${v.id}');closeDetail()">Fechar e Salvar</button>
      ${!concluido && v.currentStage ? `<button class="btn-ok" style="flex:1" onclick="confirmAdvance('${v.id}','${v.currentStage}')">${NEXT_LABEL[v.currentStage]||'Avançar'}</button>` : ''}

  // platforms — use generic selector since id contains video id
  const boxes=document.querySelectorAll('[id^="plat-grid-"] input[type=checkbox]');

async function delVideo(vid){

    <div style="font-size:11px;color:#555;font-family:'DM Mono',monospace;margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em">Produção mensal por professor</div>
    <div class="prof-grid" id="prof-stats"></div>`;

  const sy=document.getElementById('df-year'); if(sy&&prevYear) sy.value=prevYear; else if(sy) sy.value=String(yearNow);
  const sm=document.getElementById('df-mes');  if(sm&&prevMes) sm.value=prevMes;
  const sp=document.getElementById('df-prof'); if(sp&&prevProf) sp.value=prevProf;
  const st=document.getElementById('df-tipo'); if(st&&prevTipo) st.value=prevTipo;

  updateDash();
}

function getFiltered(){
  const y=document.getElementById('df-year')?.value;
  const m=document.getElementById('df-mes')?.value;
  const pf=document.getElementById('df-prof')?.value;
  const tf=document.getElementById('df-tipo')?.value;
  return videos.filter(v=>{
    if(y&&v.criadoEm&&new Date(v.criadoEm).getFullYear()!==parseInt(y)) return false;
    if(m&&v.criadoEm&&String(new Date(v.criadoEm).getMonth()+1).padStart(2,'0')!==m) return false;
    if(pf&&(!v.professor||String(v.professor.id)!==pf)) return false;
    if(tf&&v.tipo!==tf) return false;
    return true;
  });
}

function updateDash(){
  const fv=getFiltered();
  const mesAtual=getMesAno(new Date());

  // KPIs
  const totalCriados=fv.length;
  const totalConcluidos=fv.filter(isConcluido).length;
  const totalPublicados=fv.filter(v=>v.statusPublicacao==='done').length;
  const mesAtualVids=fv.filter(v=>getMesAno(v.criadoEm)===mesAtual).length;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kpi-num" style="color:#8b7cf6">${totalCriados}</div><div class="kpi-lbl">Total cadastrado</div></div>
    <div class="kpi"><div class="kpi-num" style="color:#4caf76">${totalConcluidos}</div><div class="kpi-lbl">Concluídos</div></div>
    <div class="kpi"><div class="kpi-num" style="color:#5bafd6">${totalPublicados}</div><div class="kpi-lbl">Publicados</div></div>
    <div class="kpi"><div class="kpi-num" style="color:#c9883a">${mesAtualVids}</div><div class="kpi-lbl">Este mês</div></div>`;

  // timeline — last 12 months, grouped bar per esteira
  const months=[];
  for(let i=11;i>=0;i--){
    const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    months.push(getMesAno(d));
  }
  const monthLabels=months.map(m=>{const[y,mo]=m.split('-');return MESES[parseInt(mo)-1]+'/'+y.slice(2)});
  const tsKeys={roteiro:'roteiroFeitoEm',gravacao:'gravacaoFeitaEm',edicao:'edicaoFeitaEm',publicacao:'publicadoEm'};
  const timelineData=ESTEIRAS.map(e=>({
    label:EL[e],
    data:months.map(m=>fv.filter(v=>getMesAno(v[tsKeys[e]])===m).length),
    backgroundColor:COLOR[e]+'bb',
    borderColor:COLOR[e],
    borderWidth:1,
    borderRadius:3,
  }));

  destroyChart('ch-timeline');
  charts['ch-timeline']=new Chart(document.getElementById('ch-timeline'),{
    type:'bar',
    data:{labels:monthLabels,datasets:timelineData},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#888',font:{size:11}}}},
      scales:{
        x:{ticks:{color:'#555',font:{size:10}},grid:{color:'#1e1e22'},stacked:false},
        y:{ticks:{color:'#555',stepSize:1},grid:{color:'#1e1e22'},min:0,stacked:false}
      }
    }
  });

  // tipo doughnut
  const tipoMap={};
  fv.forEach(v=>{const t=v.tipo||'Sem tipo';tipoMap[t]=(tipoMap[t]||0)+1});
  const tipoColors=['#8b7cf6','#5bafd6','#e09050','#4caf76','#e05c5c','#c9883a'];
  destroyChart('ch-tipo');
  charts['ch-tipo']=new Chart(document.getElementById('ch-tipo'),{
    type:'doughnut',
    data:{labels:Object.keys(tipoMap),datasets:[{data:Object.values(tipoMap),
      backgroundColor:tipoColors,borderColor:'#0e0e0f',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{color:'#888',font:{size:10},boxWidth:12}}}}
  });

  // plataformas bar
  const platMap={};
  fv.forEach(v=>{(v.pubPlataformas||[]).forEach(p=>{platMap[p]=(platMap[p]||0)+1})});
  destroyChart('ch-plat');
  charts['ch-plat']=new Chart(document.getElementById('ch-plat'),{
    type:'bar',
    data:{labels:Object.keys(platMap).length?Object.keys(platMap):['—'],
      datasets:[{data:Object.keys(platMap).length?Object.values(platMap):[0],
        backgroundColor:'#5bafd6aa',borderColor:'#5bafd6',borderWidth:1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#555'},grid:{color:'#1e1e22'}},
              y:{ticks:{color:'#555',stepSize:1},grid:{color:'#1e1e22'},min:0}}}
  });

  // prof stats
  const profStatsEl=document.getElementById('prof-stats');
  if(profStatsEl){
    profStatsEl.innerHTML=professores.map(p=>{
      const cnt=fv.filter(v=>v.professor&&v.professor.id===p.id&&getMesAno(v.criadoEm)===mesAtual).length;
      const c=color(cnt); const pct=Math.min(100,Math.round((cnt/META)*100));
      return `<div class="prof-card">
        <div class="prof-instr">${p.instrumento}</div>
        <div class="prof-nome">${p.nome}</div>
        <div class="pbar-row">
          <div class="pbar" style="flex:1"><div class="pfill" style="width:${pct}%;background:${c}"></div></div>
          <span class="pbar-num" style="color:${c}">${cnt}/${META}</span>
        </div></div>`;
    }).join('');
  }
}

function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

// ── Tipos admin ───────────────────────────────────────────────────────────────

function renderTipos(){
  const el=document.getElementById('pane-tipos');
  const rows=tipos.map(t=>`<div class="padmin-row">
    <span class="padmin-nome" style="flex:2">${t.nome}</span>
    <button class="btn-edit" onclick="openTipoModal(${t.id})">Editar</button>
    <button class="btn-del" onclick="delTipo(${t.id},'${t.nome.replace(/'/g,\"\'\").replace(/"/g,\"&quot;\")}')">Remover</button>
  </div>`).join('');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:12px;color:#555;font-family:'DM Mono',monospace">${tipos.length} tipo(s) cadastrado(s)</span>
      <button class="btn-primary" onclick="openTipoModal()">+ Adicionar tipo</button>
    </div>
    <div style="background:#111113;border:1px solid #1e1e22;border-radius:12px">${rows||'<div class="empty-msg" style="padding:20px">Nenhum tipo cadastrado.</div>'}</div>`;
}

function openTipoModal(id){
  editTipoId=id||null;
  document.getElementById('m-tipo-title').textContent=editTipoId?'Editar tipo':'Adicionar tipo';
  const t=editTipoId?tipos.find(x=>x.id===editTipoId):null;
  document.getElementById('ft-nome').value=t?t.nome:'';
  document.getElementById('m-tipo').style.display='flex';
  setTimeout(()=>document.getElementById('ft-nome').focus(),50);
}
function closeTipoModal(){document.getElementById('m-tipo').style.display='none'; editTipoId=null;}

async function submitTipo(){
  const nome=document.getElementById('ft-nome').value.trim();
  if(!nome){alert('Informe o nome do tipo.');return;}
  saving(true);
  if(editTipoId){
    const upd=await api(`/api/tipos/${editTipoId}`,'PUT',{nome});
    if(upd.error){alert(upd.error);saving(false);return;}
    const i=tipos.findIndex(t=>t.id===editTipoId); if(i!==-1) tipos[i]=upd;
  } else {
    const nt=await api('/api/tipos','POST',{nome});
    if(nt.error){alert(nt.error);saving(false);return;}
    tipos.push(nt);
  }
  closeTipoModal(); renderAll(); saving(false);
}

async function delTipo(id,nome){
  if(!confirm('Remover o tipo "'+nome+'"?')) return;
  saving(true);
  await api(`/api/tipos/${id}`,'DELETE');
  tipos=tipos.filter(t=>t.id!==id);
  renderAll(); saving(false);
}

// ── Professores admin ─────────────────────────────────────────────────────────

function renderProfessores(){
  const el=document.getElementById('pane-professores');
  const rows=professores.map(p=>`<div class="padmin-row">
    <span class="padmin-nome">${p.nome}</span>
    <span class="padmin-instr">${p.instrumento}</span>
    <button class="btn-edit" onclick="openEditProf(${p.id})">Editar</button>
    <button class="btn-del" onclick="delProf(${p.id})">Remover</button>
  </div>`).join('');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:12px;color:#555;font-family:'DM Mono',monospace">${professores.length} professor(es) cadastrado(s)</span>
      <button class="btn-primary" onclick="openProfModal()">+ Adicionar professor</button>
    </div>
    <div style="background:#111113;border:1px solid #1e1e22;border-radius:12px">${rows||'<div class="empty-msg" style="padding:20px">Nenhum professor cadastrado.</div>'}</div>`;
}

function openProfModal(id){
  editProfId=id||null;
  document.getElementById('m-prof-title').textContent=id?'Editar professor':'Adicionar professor';
  if(id){
    const p=professores.find(x=>x.id===id);
    document.getElementById('fp-nome').value=p.nome;
    document.getElementById('fp-instr').value=p.instrumento;
  } else {
    document.getElementById('fp-nome').value='';
    document.getElementById('fp-instr').value='';
  }
  document.getElementById('m-prof').style.display='flex';
}
function openEditProf(id){openProfModal(id);}
function closeProfModal(){document.getElementById('m-prof').style.display='none'; editProfId=null;}

async function submitProf(){
  const nome=document.getElementById('fp-nome').value.trim();
  const instrumento=document.getElementById('fp-instr').value.trim();
  if(!nome||!instrumento){alert('Preencha nome e instrumento.');return;}
  saving(true);
  if(editProfId){
    const upd=await api(`/api/professores/${editProfId}`,'PUT',{nome,instrumento});
    const i=professores.findIndex(p=>p.id===editProfId); if(i!==-1) professores[i]=upd;
  } else {
    const np=await api('/api/professores','POST',{nome,instrumento});
    professores.push(np);
  }
  closeProfModal(); renderAll(); saving(false);
}

async function delProf(id){
  if(!confirm('Remover este professor?')) return;
  saving(true);
  await api(`/api/professores/${id}`,'DELETE');
  professores=professores.filter(p=>p.id!==id);
  renderAll(); saving(false);
}

// ── Tab switch ────────────────────────────────────────────────────────────────

function sw(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  renderAll();
}

// ── Init ──────────────────────────────────────────────────────────────────────
load();
setInterval(load,30000);
</script>
