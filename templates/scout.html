<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scout — Sankyu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif:wght@400;600;italic&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif',serif;background:#0e0e0f;color:#e8e4d8;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
input,select,textarea{background:#1a1a1d;border:1px solid #2a2a2e;border-radius:8px;padding:8px 10px;font-size:13px;color:#e8e4d8;width:100%;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#5c4db1}
select option{background:#1a1a1d}
button{font-family:inherit;cursor:pointer}

/* layout */
#wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
.hdr{border-bottom:1px solid #1e1e20;padding:12px 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0e0e0f;z-index:50}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-logo{height:36px;width:auto}
.hdr-text .sub{font-size:10px;letter-spacing:.2em;color:#5c4db1;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:2px}
.hdr-text .title{font-size:17px;font-weight:600}
.hdr-right{display:flex;gap:8px;align-items:center}
.saving{font-size:10px;color:#555;font-family:'DM Mono',monospace}
.btn-p{background:#1a1628;border:1px solid #5c4db1;border-radius:8px;padding:7px 14px;color:#9b7cf6;font-size:12px;font-weight:500;font-family:'DM Mono',monospace}
.btn-p:hover{background:#221a38}
.btn-sec{background:none;border:1px solid #2a2a2e;border-radius:8px;padding:7px 12px;color:#888;font-size:12px;font-family:'DM Mono',monospace}
.btn-sec:hover{border-color:#555;color:#ccc}

/* tabs */
.tabs{display:flex;border-bottom:1px solid #1e1e20}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#555;padding:10px 14px;font-size:12px;font-family:'DM Mono',monospace;letter-spacing:.06em}
.tab.active{border-bottom-color:#8b7cf6;color:#e8e4d8}
.tab:hover:not(.active){color:#999}
.pane{padding:18px 0;display:none}
.pane.active{display:block}

/* tables */
.tbl-wrap{background:#111113;border:1px solid #1e1e22;border-radius:12px;overflow:hidden}
.stbl{width:100%;border-collapse:collapse;font-size:12px}
.stbl th{text-align:left;padding:8px 12px;font-size:10px;color:#555;font-family:'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #1e1e22;font-weight:400}
.stbl td{padding:9px 12px;border-bottom:1px solid #17171a;color:#ccc;vertical-align:middle}
.stbl tr:last-child td{border-bottom:none}
.stbl tr:hover td{background:#131315;cursor:pointer}
.btn-xs{background:none;border:1px solid #2a2a2e;border-radius:6px;padding:3px 9px;font-size:11px;color:#888}
.btn-xs:hover{border-color:#555;color:#ccc}
.btn-xs.del{border-color:#3a1515;color:#c05050}
.btn-xs.del:hover{background:#1a0808}
.empty{text-align:center;padding:32px;color:#444;font-style:italic;font-size:13px}

/* nivel badge */
.nivel{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-family:'DM Mono',monospace;font-weight:500}
.n0{background:#1a1a1d;color:#555}
.n1{background:#1f1628;color:#9b7cf6}
.n2{background:#1a2535;color:#5bafd6}
.n3{background:#1f2010;color:#a8c050}
.n4{background:#1f1509;color:#c9883a}
.n5{background:#1a3325;color:#4caf76}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#111113;border:1px solid #2a2a2e;border-radius:14px;padding:22px;width:480px;max-height:90vh;overflow-y:auto}
.modal.wide{width:700px}
.modal.xl{width:900px}
.modal h3{font-size:15px;font-weight:600;color:#e8e4d8;margin-bottom:18px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:10px;color:#555;font-family:'DM Mono',monospace;margin-bottom:5px;letter-spacing:.1em;text-transform:uppercase}
.mactions{display:flex;gap:8px;margin-top:18px}
.btn-ok{flex:2;padding:9px;background:#17122a;border:1px solid #5c4db1;border-radius:8px;color:#9b7cf6;font-size:13px;font-weight:600}
.btn-ok:hover{background:#1f1838}
.btn-cancel{flex:1;padding:9px;background:none;border:1px solid #2a2a2e;border-radius:8px;color:#666;font-size:13px}
.btn-cancel:hover{border-color:#444;color:#aaa}
.btn-del2{padding:9px 14px;background:none;border:1px solid #3a1515;border-radius:8px;color:#c05050;font-size:12px}
.btn-del2:hover{background:#1a0808}

/* ficha aluno */
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ficha-instr-hdr{font-size:11px;font-weight:600;color:#8b7cf6;font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:8px 0 4px;border-bottom:1px solid #1e1e22;margin-bottom:6px;grid-column:1/-1}
.musica-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #151518}
.musica-nome-sm{font-size:12px;color:#ccc;flex:1;padding-right:8px}
.nivel-select{width:auto;min-width:160px;font-size:11px;padding:4px 6px}
.btn-save-ficha{font-size:11px;padding:3px 10px;background:#17122a;border:1px solid #5c4db1;border-radius:6px;color:#9b7cf6;margin-left:6px}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-row select{width:auto;font-size:12px;padding:6px 10px}
.filter-row input{width:200px;font-size:12px;padding:6px 10px}
.filter-row label{font-size:11px;color:#666;font-family:'DM Mono',monospace;white-space:nowrap}

/* eventos */
.evt-tipo{font-size:9px;padding:2px 7px;border-radius:8px;font-family:'DM Mono',monospace}
.evt-treino{background:#1a2535;color:#5bafd6;border:1px solid #1e3a50}
.evt-apresentacao{background:#1a3325;color:#4caf76;border:1px solid #2a4e38}
.presenca-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #17171a}
.presenca-item:last-child{border-bottom:none}

/* qr section */
.qr-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.qr-card{background:#111113;border:1px solid #1e1e22;border-radius:12px;padding:20px;text-align:center}
.qr-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.qr-card .sub{font-size:11px;color:#666;font-family:'DM Mono',monospace;margin-bottom:16px}
.qr-svg{width:210px;height:210px;background:#fff;border-radius:8px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.qr-url{font-size:10px;color:#555;font-family:'DM Mono',monospace;word-break:break-all;margin-bottom:12px}
</style>
</head>

<script>
const SENHA = "{{ senha }}";
const NIVEIS = [{v:0,l:"Ainda não sei"},{v:1,l:"1 — Iniciante"},{v:2,l:"2 — Em evolução"},{v:3,l:"3 — Com acompanhamento"},{v:4,l:"4 — Toca sozinho"},{v:5,l:"5 — Proficiente"}];
const NIVEL_LABEL = {0:"Ainda não sei",1:"Iniciante",2:"Em evolução",3:"Com acompanhamento",4:"Toca sozinho",5:"Proficiente"};
const NIVEL_CLASS = {0:"n0",1:"n1",2:"n2",3:"n3",4:"n4",5:"n5"};

let alunos=[], musicas=[], instrumentos=[], eventos=[], curTab='alunos';
let editAlunoId=null, crudMode=null, crudId=null, crudType=null;

function sav(s){document.getElementById('saving').style.display=s?'inline':'none'}

async function api(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts); return r.json();
}

async function load(){
  [alunos,musicas,instrumentos,eventos]=await Promise.all([
    api('/api/scout/alunos'),api('/api/scout/musicas'),
    api('/api/scout/instrumentos'),api('/api/scout/eventos')
  ]);
  renderAll();
}

function renderAll(){
  if(curTab==='alunos') renderAlunos();
  else if(curTab==='eventos') renderEventos();
  else if(curTab==='musicas') renderMusicas();
  else if(curTab==='instrumentos') renderInstrumentos();
  else if(curTab==='qrcodes') renderQR();
}

function sw(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  renderAll();
}

// ── Alunos ────────────────────────────────────────────────────────────────────

function renderAlunos(){
  const el=document.getElementById('pane-alunos');
  const q=(document.getElementById('busca-aluno')?.value||'').toLowerCase();
  const fi=document.getElementById('fil-instr')?.value||'';
  let lista=alunos;
  if(q) lista=lista.filter(a=>a.nome.toLowerCase().includes(q));

  el.innerHTML=`
    <div class="filter-row">
      <label>Buscar:</label>
      <input id="busca-aluno" placeholder="Nome do aluno" oninput="renderAlunos()" value="${q}" style="width:220px"/>
      <label>Instrumento:</label>
      <select id="fil-instr" onchange="renderAlunos()">
        <option value="">Todos</option>
        ${instrumentos.map(i=>`<option value="${i.id}" ${fi==i.id?'selected':''}>${i.nome}</option>`).join('')}
      </select>
      <span style="font-size:11px;color:#555;font-family:'DM Mono',monospace;margin-left:auto">${lista.length} aluno(s)</span>
    </div>
    <div class="tbl-wrap">
      <table class="stbl">
        <thead><tr><th>Nome</th><th>Contato</th><th>Cadastrado em</th><th style="width:120px"></th></tr></thead>
        <tbody>
          ${lista.length===0?`<tr><td colspan="4" class="empty">Nenhum aluno encontrado.</td></tr>`:
          lista.map(a=>`<tr onclick="openFicha(${a.id})">
            <td style="font-weight:600;color:#e0ddd5">${a.nome}</td>
            <td style="color:#777">${a.contato||'—'}</td>
            <td style="color:#555;font-family:'DM Mono',monospace;font-size:11px">${fmtDate(a.criadoEm)}</td>
            <td onclick="event.stopPropagation()" style="display:flex;gap:5px">
              <button class="btn-xs" onclick="openEditAluno(${a.id})">Editar</button>

}

function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return d.toLocaleDateString('pt-BR');
}

// ── Aluno CRUD ────────────────────────────────────────────────────────────────

let alunoInstrSel = new Set();

const NIVEIS_MODAL=[
  {v:0,l:"Ainda não sei"},{v:1,l:"1 — Iniciante"},{v:2,l:"2 — Em evolução"},
  {v:3,l:"3 — Com acompanhamento"},{v:4,l:"4 — Toca sozinho"},{v:5,l:"5 — Proficiente"}
];

function renderAlunoInstrGrid(){
  const grid=document.getElementById('fa-instr-grid');
  if(!grid) return;
  grid.innerHTML=instrumentos.map(i=>`
    <label style="display:flex;align-items:center;gap:7px;background:${alunoInstrSel.has(i.id)?'#1a1628':'#1a1a1d'};
      border:1px solid ${alunoInstrSel.has(i.id)?'#5c4db1':'#2a2a2e'};border-radius:8px;padding:7px 12px;cursor:pointer;user-select:none"
      onclick="toggleAlunoInstr(${i.id},this)">
      <span style="width:13px;height:13px;border-radius:3px;border:1px solid ${alunoInstrSel.has(i.id)?'#5c4db1':'#444'};
        background:${alunoInstrSel.has(i.id)?'#5c4db1':'transparent'};display:flex;align-items:center;justify-content:center;
        font-size:9px;color:#fff;flex-shrink:0">${alunoInstrSel.has(i.id)?'✓':''}</span>
      <span style="font-size:13px;color:${alunoInstrSel.has(i.id)?'#e8e4d8':'#ccc'}">${i.nome}</span>
    </label>`).join('');
}

function toggleAlunoInstr(id){
  if(alunoInstrSel.has(id)) alunoInstrSel.delete(id);
  else alunoInstrSel.add(id);
  renderAlunoInstrGrid();
  renderAlunoRepGrid();
}

function renderAlunoRepGrid(){
  const area=document.getElementById('fa-rep-area');
  if(!area) return;
  const sels=[...alunoInstrSel].map(id=>instrumentos.find(i=>i.id===id)).filter(Boolean);
  if(sels.length===0){
    area.innerHTML='<div style="font-size:12px;color:#555;font-style:italic;padding:8px 0">Selecione os instrumentos acima para preencher o repertório.</div>';
    return;
  }
  const nivelOpts=NIVEIS_MODAL.map(n=>`<option value="${n.v}">${n.l}</option>`).join('');
  const thCols=sels.map(i=>`<th style="min-width:150px;color:#9b7cf6;font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-bottom:1px solid #1e1e22;background:#111113;white-space:nowrap">${i.nome}</th>`).join('');
  const rows=musicas.map(m=>{
    const tds=sels.map(i=>`<td style="padding:5px 8px;border-bottom:1px solid #151518">
      <select style="width:100%;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:6px;padding:4px 6px;font-size:11px;color:#e8e4d8;outline:none;font-family:inherit;min-width:140px" data-mid="${m.id}" data-iid="${i.id}" class="fa-nivel">${nivelOpts}</select></td>`).join('');
    return `<tr><td style="padding:6px 10px;border-bottom:1px solid #151518;font-size:12px;color:#ccc;white-space:nowrap">${m.nome}</td>${tds}</tr>`;
  }).join('');
  area.innerHTML=`<div style="max-height:280px;overflow:auto;border-radius:8px;border:1px solid #1e1e22;margin-top:8px">
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr>
        <th style="min-width:170px;text-align:left;padding:7px 10px;font-size:10px;color:#555;font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid #1e1e22;background:#111113;position:sticky;top:0">Música</th>
        ${thCols}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

function openAddAluno(nomePreenchido=''){
  editAlunoId=null;
  alunoInstrSel=new Set();
  document.getElementById('m-aluno-title').textContent='Novo aluno';
  document.getElementById('fa-nome').value=nomePreenchido;
  document.getElementById('fa-obs').value='';
  document.getElementById('btn-salvar-aluno').textContent='Salvar aluno';
  renderAlunoInstrGrid();
  renderAlunoRepGrid();
  document.getElementById('m-aluno').style.display='flex';
  setTimeout(()=>document.getElementById('fa-nome').focus(),50);
}

function openEditAluno(id){
  editAlunoId=id;
  alunoInstrSel=new Set();
  const a=alunos.find(x=>x.id===id);
  document.getElementById('m-aluno-title').textContent='Editar aluno';
  document.getElementById('fa-nome').value=a.nome;
  document.getElementById('fa-obs').value=a.obs||'';
  document.getElementById('btn-salvar-aluno').textContent='Salvar alterações';
  renderAlunoInstrGrid();
  renderAlunoRepGrid();
  document.getElementById('m-aluno').style.display='flex';
}

async function submitAluno(){
  const nome=document.getElementById('fa-nome').value.trim();
  if(!nome){alert('Nome obrigatório');return;}
  sav(true);
  const body={nome,obs:document.getElementById('fa-obs').value};
  let aid;
  if(editAlunoId){
    const upd=await api(`/api/scout/alunos/${editAlunoId}`,'PUT',body);
    const i=alunos.findIndex(a=>a.id===editAlunoId); if(i!==-1) alunos[i]=upd;
    aid=editAlunoId;
  } else {
    const na=await api('/api/scout/alunos','POST',body);
    alunos.push(na);
    aid=na.id;
  }
  const nivSels=document.querySelectorAll('.fa-nivel');
  if(nivSels.length>0){
    const fichas=[...nivSels].map(s=>({aluno_id:aid,instrumento_id:parseInt(s.dataset.iid),musica_id:parseInt(s.dataset.mid),nivel:parseInt(s.value)}));
    await api('/api/scout/fichas/bulk','POST',{fichas});
  }
  closeModal('m-aluno'); renderAll(); sav(false);
}

async function delAluno(id){
  const a=alunos.find(x=>x.id===id);
  if(!confirm(`Excluir "${a.nome}" e todas as suas fichas?`)) return;
  sav(true);
  await api(`/api/scout/alunos/${id}`,'DELETE');
  alunos=alunos.filter(x=>x.id!==id);
  renderAll(); sav(false);
}

// ── Fuzzy name matching ───────────────────────────────────────────────────────

function fuzzyScore(a, b){
  const ta=a.toLowerCase().trim().split(/\s+/);
  const tb=b.toLowerCase().trim().split(/\s+/);
  let hits=0;
  ta.forEach(w=>{if(tb.some(wb=>wb.startsWith(w)||w.startsWith(wb))) hits++;});
  return hits/Math.max(ta.length,tb.length);
}

function findMatches(nome){
  return alunos
    .map(a=>({aluno:a,score:fuzzyScore(nome,a.nome)}))
    .filter(x=>x.score>0.3)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5);
}

function openVincular(presencaId, eventoId, nomePres){
  const matches=findMatches(nomePres);
  const body=document.getElementById('m-vincular-body');
  const nomeEsc=nomePres.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const matchRows=matches.length===0
    ?`<div style="font-size:13px;color:#555;font-style:italic;padding:12px 0">Nenhum aluno com nome parecido encontrado.</div>`
    :matches.map(({aluno,score})=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;
        background:#17171a;border:1px solid #222;border-radius:8px;margin-bottom:6px">
        <div>
          <div style="font-size:13px;color:#e0ddd5;font-weight:500">${aluno.nome}</div>
          <div style="font-size:10px;color:#555;font-family:'DM Mono',monospace">${Math.round(score*100)}% parecido</div>
        </div>
        <button class="btn-xs" style="border-color:#5c4db1;color:#9b7cf6"
          onclick="vincularEAbrir(${presencaId},${aluno.id},${eventoId})">Vincular e abrir ficha</button>
      </div>`).join('');

  body.innerHTML=`
    <h3 style="margin-bottom:6px">Aluno não identificado</h3>
    <div style="font-size:12px;color:#777;margin-bottom:14px">
      Check-in com o nome: <strong style="color:#c9883a">"${nomeEsc}"</strong>
    </div>
    ${matches.length>0?'<div style="font-size:11px;color:#555;font-family:\'DM Mono\',monospace;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em">Alunos com nome parecido</div>':''}
    ${matchRows}
    <div style="border-top:1px solid #1e1e22;margin-top:12px;padding-top:12px">
      <div style="font-size:11px;color:#555;font-family:'DM Mono',monospace;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em">
        ${matches.length>0?'Ou cadastrar novo':'Cadastrar novo aluno'}
      </div>
      <button class="btn-ok" style="width:100%;padding:9px"
        onclick="closeModal('m-vincular');closeModal('m-evento');openAddAluno('${nomeEsc}')">
        + Criar ficha para "${nomeEsc}"
      </button>
    </div>
    <div class="mactions" style="margin-top:12px">
      <button class="btn-cancel" onclick="voltarParaEvento()">← Voltar ao evento</button>
      <button class="btn-cancel" onclick="closeModal('m-vincular');closeModal('m-evento')">Fechar tudo</button>
    </div>`;
  document.getElementById('m-vincular').style.display='flex';
  // store eventoId for back navigation
  document.getElementById('m-vincular').dataset.eventoId=eventoId;
}

function voltarParaEvento(){
  closeModal('m-vincular');
  // m-evento is still open behind, just bring it back into view
  document.getElementById('m-evento').style.display='flex';
}

async function vincularEAbrir(presencaId, alunoId, eventoId){
  // Save the link in the database
  sav(true);
  await api(`/api/scout/presencas/${presencaId}/vincular`,'POST',{aluno_id:alunoId});
  sav(false);
  // Close modals and open the aluno's ficha
  closeModal('m-vincular');
  closeModal('m-evento');
  // Refresh the evento data in memory
  const evtIdx=eventos.findIndex(e=>e.id===eventoId);
  if(evtIdx!==-1){
    const upd=await api(`/api/scout/eventos/${eventoId}`);
    eventos[evtIdx]=upd;
  }
  openFicha(alunoId);
}

// ── Ficha do aluno ────────────────────────────────────────────────────────────

async function openFicha(aid){
  const a=alunos.find(x=>x.id===aid);
  const fichas=await api(`/api/scout/alunos/${aid}/fichas`);

  // group fichas by instrumento
  const byInstr={};
  fichas.forEach(f=>{
    const k=f.instrumento.id;
    if(!byInstr[k]) byInstr[k]={instr:f.instrumento,fichas:[]};
    byInstr[k].fichas.push(f);
  });

  // build instrumento blocks
  let instrBlocks='';
  instrumentos.forEach(instr=>{
    const group=byInstr[instr.id];
    const rows=musicas.map(m=>{
      const ficha=group?.fichas.find(f=>f.musica.id===m.id);
      const nivel=ficha?ficha.nivel:0;
      const fid=ficha?ficha.id:'new';
      const nivelOpts=NIVEIS.map(n=>`<option value="${n.v}" ${nivel===n.v?'selected':''}>${n.l}</option>`).join('');
      return `<div class="musica-row">
        <span class="musica-nome-sm">${m.nome}</span>
        <select class="nivel-select" id="niv-${aid}-${instr.id}-${m.id}" data-fid="${fid}" data-aid="${aid}" data-iid="${instr.id}" data-mid="${m.id}">${nivelOpts}</select>
      </div>`;
    }).join('');
    instrBlocks+=`<div style="margin-bottom:20px">
      <div style="font-size:12px;font-weight:600;color:#8b7cf6;font-family:'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid #1e1e22;margin-bottom:8px">${instr.nome}</div>
      <div style="max-height:260px;overflow-y:auto">${rows}</div>
    </div>`;
  });

  document.getElementById('m-ficha-body').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div>
        <h3 style="margin:0">${a.nome}</h3>
        ${a.contato?`<div style="font-size:11px;color:#555;font-family:'DM Mono',monospace;margin-top:3px">${a.contato}</div>`:''}
      </div>
      <span style="font-size:10px;color:#555;font-family:'DM Mono',monospace">Clique em Salvar ficha para confirmar alterações</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-height:60vh;overflow-y:auto">
      ${instrBlocks}
    </div>
    <div class="mactions">
      <button class="btn-cancel" onclick="closeModal('m-ficha')">Fechar</button>
      <button class="btn-ok" onclick="salvarFicha(${aid})">Salvar ficha</button>
    </div>`;
  document.getElementById('m-ficha').style.display='flex';
}

async function salvarFicha(aid){
  const sels=document.querySelectorAll(`.nivel-select[data-aid="${aid}"]`);
  const items=[];
  sels.forEach(sel=>{
    items.push({aluno_id:aid,instrumento_id:parseInt(sel.dataset.iid),
      musica_id:parseInt(sel.dataset.mid),nivel:parseInt(sel.value)});
  });
  sav(true);
  await api('/api/scout/fichas/bulk','POST',{fichas:items});
  closeModal('m-ficha'); sav(false);
  alert('Ficha salva!');
}

// ── Eventos ───────────────────────────────────────────────────────────────────

function renderEventos(){
  const el=document.getElementById('pane-eventos');

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:12px;color:#555;font-family:'DM Mono',monospace">${eventos.length} evento(s)</span>

            <td style="font-family:'DM Mono',monospace;font-size:11px;color:#777">${fmtDate(e.data+'T12:00:00')}</td>

function setEvtDataHoje(){
  const hoje=new Date().toISOString().split('T')[0];
  document.getElementById('fe-data').value=hoje;
}

async function submitEvento(){
  const tipo=document.getElementById('fe-tipo').value;
  const data=document.getElementById('fe-data').value;
  if(!data){alert('Informe a data');return;}
  const tipoLabel=tipo==='treino'?'Treino em Conjunto':'Apresentação';
  const d=new Date(data+'T12:00:00');
  const titulo=`${tipoLabel} — ${d.toLocaleDateString('pt-BR')}`;
  sav(true);
  const ne=await api('/api/scout/eventos','POST',{tipo,titulo,data,obs:document.getElementById('fe-obs').value});
  eventos.unshift(ne);
  closeModal('m-add-evento'); renderAll(); sav(false);
}

async function delEvento(id){
  const e=eventos.find(x=>x.id===id);
  if(!confirm(`Excluir o evento "${e.titulo}" e todas as presenças?`)) return;
  sav(true);
  await api(`/api/scout/eventos/${id}`,'DELETE');
  eventos=eventos.filter(x=>x.id!==id);
  renderAll(); sav(false);
}

async function openEvento(id){
  const d=await api(`/api/scout/eventos/${id}`);
  const ps=d.presencas||[];

  // build presence items with clickable name that tries to find matching aluno
  const presItems=ps.length===0?'<div class="empty">Nenhuma presença registrada.</div>':
    ps.map(p=>{
      // find aluno by name (case-insensitive, trimmed)
      // 1st priority: linked via DB (alunoId saved), 2nd: exact name match
      const linked = p.alunoId ? alunos.find(a=>a.id===p.alunoId) : null;
      const match = linked || alunos.find(a=>a.nome.trim().toLowerCase()===p.nome.trim().toLowerCase());
      const nomeEsc=p.nome.replace(/'/g,"&#39;").replace(/"/g,"&quot;");
      const isLinked = !!p.alunoId; // saved in DB
      const nomeHtml=match
        ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span style="font-size:13px;color:#9b7cf6;cursor:pointer;text-decoration:underline;text-underline-offset:3px"
              onclick="closeModal('m-evento');openFicha(${match.id})" title="Abrir ficha de ${match.nome}">${p.nome} ↗</span>
            <button class="btn-xs" style="font-size:10px;padding:2px 8px" onclick="openVincular(${p.id},${id},'${nomeEsc}')">trocar</button>
           </div>`
        : `<span style="font-size:13px;color:#c9883a;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-style:dashed"
            onclick="openVincular(${p.id},${id},'${nomeEsc}')" title="Clique para identificar este aluno">${p.nome}
            <span style="font-size:10px;color:#c9883a;font-family:'DM Mono',monospace;margin-left:4px">? identificar ↗</span></span>`;
      return `<div class="presenca-item">
        ${nomeHtml}
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:10px;color:#555;font-family:'DM Mono',monospace">${fmtDate(p.criadoEm)}</span>
          <button class="btn-xs del" onclick="delPresenca(${p.id},${id})">Remover</button>
        </div>
      </div>`;
    }).join('');

  document.getElementById('m-evento-body').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
      <div>
        <h3 style="margin:0">${d.titulo}</h3>
        <div style="font-size:11px;color:#555;font-family:'DM Mono',monospace;margin-top:4px">${fmtDate(d.data+'T12:00:00')} · ${ps.length} presença(s)</div>
      </div>
      <span class="evt-tipo evt-${d.tipo}">${d.tipo==='treino'?'Treino':'Apresentação'}</span>
    </div>
    ${ps.length>0?'<div style="font-size:11px;color:#555;font-family:\'DM Mono\',monospace;margin-bottom:8px">Roxo = identificado · Laranja = não identificado (clique para vincular)</div>':''}
    <div style="background:#17171a;border:1px solid #222;border-radius:10px;max-height:400px;overflow-y:auto">
      ${presItems}
    </div>
    ${d.obs?`<div style="font-size:12px;color:#555;font-style:italic;margin-top:10px">${d.obs}</div>`:''}
    <div class="mactions" style="margin-top:14px">
      <button class="btn-cancel" onclick="closeModal('m-evento')">Fechar</button>
      <button class="btn-ok" style="flex:1" onclick="addPresencaManual(${d.id})">+ Adicionar presença</button>
    </div>`;
  document.getElementById('m-evento').style.display='flex';
}

async function delPresenca(pid,eid){
  if(!confirm('Remover esta presença?')) return;
  sav(true);
  await api(`/api/scout/presencas/${pid}`,'DELETE');
  // refresh modal
  closeModal('m-evento');
  const i=eventos.findIndex(e=>e.id===eid);
  if(i!==-1) eventos[i].totalPresencas=Math.max(0,eventos[i].totalPresencas-1);
  openEvento(eid); sav(false);
}

async function addPresencaManual(eventoId){
  const nome=prompt('Nome do aluno a adicionar:');
  if(!nome||!nome.trim()) return;
  sav(true);
  const r=await api(`/api/scout/eventos/${eventoId}/presencas`,'POST',{nome:nome.trim()});
  if(r.ok){
    const i=eventos.findIndex(e=>e.id===eventoId);
    if(i!==-1) eventos[i].totalPresencas=(eventos[i].totalPresencas||0)+1;
    openEvento(eventoId);
  } else {
    alert(r.error||'Erro ao adicionar');
  }
  sav(false);
}

// ── CRUD genérico (músicas + instrumentos) ────────────────────────────────────

function openCrud(type, id=null, nome=''){
  crudType=type; crudId=id;
  const label=type==='musica'?'Música':'Instrumento';
  document.getElementById('m-crud-title').textContent=id?`Editar ${label}`:`Nova ${label}`;
  document.getElementById('fc-nome').value=nome;
  document.getElementById('m-crud').style.display='flex';
  setTimeout(()=>document.getElementById('fc-nome').focus(),50);
}

async function submitCrud(){
  const nome=document.getElementById('fc-nome').value.trim();
  if(!nome){alert('Nome obrigatório');return;}
  sav(true);
  const base=crudType==='musica'?'/api/scout/musicas':'/api/scout/instrumentos';
  if(crudId){
    const upd=await api(`${base}/${crudId}`,'PUT',{nome});
    if(upd.error){alert(upd.error);sav(false);return;}
    const arr=crudType==='musica'?musicas:instrumentos;
    const i=arr.findIndex(x=>x.id===crudId); if(i!==-1) arr[i]=upd;
  } else {
    const ni=await api(base,'POST',{nome});
    if(ni.error){alert(ni.error);sav(false);return;}
    if(crudType==='musica') musicas.push(ni); else instrumentos.push(ni);
  }
  closeModal('m-crud'); renderAll(); sav(false);
}

async function delCrud(type,id,nome){
  if(!confirm(`Excluir "${nome}"?`)) return;
  sav(true);
  const base=type==='musica'?'/api/scout/musicas':'/api/scout/instrumentos';
  await api(`${base}/${id}`,'DELETE');
  if(type==='musica') musicas=musicas.filter(x=>x.id!==id);
  else instrumentos=instrumentos.filter(x=>x.id!==id);
  renderAll(); sav(false);
}

// ── QR Codes ──────────────────────────────────────────────────────────────────

async function renderQR(){
  const el=document.getElementById('pane-qrcodes');
  el.innerHTML=`
    <p style="font-size:13px;color:#777;margin-bottom:20px">QR codes permanentes — nunca mudam. Ao ser escaneado, o sistema age automaticamente.</p>
    <div class="qr-cards" style="grid-template-columns:repeat(3,1fr)">
      <div class="qr-card">
        <h3>🥁 Treino em Conjunto</h3>
        <div class="sub">Check-in nos treinos semanais</div>
        <div class="qr-svg" id="qr-treino"><span style="color:#444;font-size:12px">carregando...</span></div>
        <div class="qr-url" id="qr-treino-url">—</div>
        <button class="btn-p" onclick="printQR('treino','Treino em Conjunto')">Imprimir / Salvar</button>
      </div>
      <div class="qr-card">
        <h3>🎌 Apresentação</h3>
        <div class="sub">Check-in nas apresentações</div>
        <div class="qr-svg" id="qr-apresentacao"><span style="color:#444;font-size:12px">carregando...</span></div>
        <div class="qr-url" id="qr-apresentacao-url">—</div>
        <button class="btn-p" onclick="printQR('apresentacao','Apresentação')">Imprimir / Salvar</button>
      </div>
      <div class="qr-card">
        <h3>📋 Ficha do Aluno</h3>
        <div class="sub">Cadastro inicial do repertório</div>
        <div class="qr-svg" id="qr-cadastro"><span style="color:#444;font-size:12px">carregando...</span></div>
        <div class="qr-url" id="qr-cadastro-url">—</div>
        <button class="btn-p" onclick="printQR('cadastro','Ficha do Aluno')">Imprimir / Salvar</button>
      </div>
    </div>`;

  for(const tipo of ['treino','apresentacao','cadastro']){
    const d=await api(`/api/scout/qrcode/${tipo}`);
    if(d.svg){
      // inject SVG directly, styled to fill container
      const wrapped=d.svg.replace('<svg ', '<svg style="width:100%;height:100%" ');
      document.getElementById(`qr-${tipo}`).innerHTML=wrapped;
      document.getElementById(`qr-${tipo}-url`).textContent=d.url;
    } else if(d.error){
      document.getElementById(`qr-${tipo}`).innerHTML=`<span style="color:#e05c5c;font-size:11px">${d.error}</span>`;
    }
  }
}

function printQR(tipo, label){
  const el=document.getElementById(`qr-${tipo}`);
  const svg=el.querySelector('svg');
  if(!svg){alert('QR code ainda carregando...');return;}
  const url=document.getElementById(`qr-${tipo}-url`).textContent;
  const svgStr=new XMLSerializer().serializeToString(svg);
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><body style="text-align:center;font-family:sans-serif;padding:40px;margin:0">
    <h2 style="margin-bottom:6px">Sankyu — ${label}</h2>
    <p style="color:#666;margin-bottom:20px;font-size:14px">${tipo==='cadastro'?'Escaneie para preencher sua ficha de repertório':'Escaneie para registrar sua presença'}</p>
    <div style="width:280px;height:280px;margin:0 auto">${svgStr}</div>
    <p style="margin-top:16px;font-size:11px;color:#999;word-break:break-all">${url}</p>
    <script>window.onload=()=>window.print()<\/script>
  </body></html>`);
}

function closeModal(id){document.getElementById(id).style.display='none';}

load();
setInterval(load, 60000);
